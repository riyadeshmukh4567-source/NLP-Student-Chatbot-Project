<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLP Student Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        form {
            text-align: center;
            margin-top: 25px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        .question {
            margin-top: 25px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 10px;
        }

        .answer {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 NLP Student Chatbot</h1>

    <p>Ask questions related to Natural Language Processing</p>

    <form action="/chat" method="POST">

        <input
            type="text"
            name="question"
            placeholder="Ask your NLP question..."
            value="{{ question if question else '' }}"
            required
        >

        <button type="submit">Ask</button>

    </form>

    {% if question %}
    <div class="question">
        <strong>You:</strong>
        {{ question }}
    </div>
    {% endif %}

    {% if answer %}
    <div class="answer">
        <strong>Bot:</strong>
        {{ answer }}
    </div>
    {% endif %}

</div>

</body>
</html>
